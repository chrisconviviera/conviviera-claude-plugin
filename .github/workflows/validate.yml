name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Validating the repository root checks only marketplace.json, so validate both manifests.
      - name: Validate marketplace manifest
        run: npx -y @anthropic-ai/claude-code plugin validate --strict .claude-plugin/marketplace.json
      - name: Validate plugin manifest, .mcp.json and skills
        run: npx -y @anthropic-ai/claude-code plugin validate --strict .claude-plugin/plugin.json
      - name: Smoke test (static and unauthenticated discovery)
        run: node test/smoke.mjs
        env:
          SMOKE_LIVE: '1'
